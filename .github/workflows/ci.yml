name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@2697eb286ccd2a832509f8c045615b819b932fc5 # main
    with:
      command: |
        cargo fmt --all -- --check
        cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        cargo test --locked --workspace --all-features
        cargo test --locked --workspace --all-features --release

  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@99ef0355febb9c05e35732bd4045c47ae7432b7b # main
    with:
      cargo-args: "--locked --workspace --all-targets --all-features"
