name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
    with:
      command: |
        cargo fmt --all -- --check
        cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        cargo test --locked --workspace --all-features
        cargo test --locked --workspace --all-features --release

  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@535609a4878f34a6697afea7ba3da04a454cc5f4 # main
    with:
      cargo-args: "--locked --workspace --all-targets --all-features"
