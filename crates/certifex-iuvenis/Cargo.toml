[package]
name = "certifex-iuvenis"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.1"
certifex-core = { version = "0.1.0", path = "../certifex-core" }
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "server-auto", "tokio", "http1", "http2"] }
if-addrs = "0.15.0"
pem = "4.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
serde_json = "1.0.149"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.9"
x509-parser = "0.18.1"

[lints]
workspace = true
