[package]
name = "certifex-senex"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
certifex-core = { version = "0.1.0", path = "../certifex-core" }
lurkmoar = { git = "https://github.com/codeandsolder/lurkmoar-rs", rev = "01b253e354a311920989f8859975f2134f29e81f" }
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "time", "x509-parser"] }
pem = "4.0.0"
wreq = { git = "https://github.com/codeandsolder/wreq-exp.git", rev = "7c0668c3b3e137f233c0aaee132028ab39572dbd", features = ["json", "query"] }
bytes = "1"
http = "1"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "time", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x509-parser = "0.18.1"

[lints]
workspace = true

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
